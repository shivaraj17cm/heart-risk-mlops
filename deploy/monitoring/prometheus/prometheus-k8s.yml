# Prometheus config for Kubernetes: discovers every API pod (not just one behind the
# Service) via the Kubernetes API, using the prometheus.io/* pod annotations.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: heart-risk-api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [heart-risk]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: env
        replacement: kubernetes
