apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: heart-risk
---
# Least privilege: read-only access to pods in this namespace only (for service discovery)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: heart-risk
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: heart-risk
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: heart-risk
roleRef:
  kind: Role
  name: prometheus-pod-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: heart-risk
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: heart-risk}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: heart-risk}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2d
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: web}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - {key: prometheus-k8s.yml, path: prometheus.yml}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: heart-risk
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: web}
