# OPTIONAL alternative to the LoadBalancer Service: expose the API through an NGINX Ingress.
# Requires an ingress controller (Minikube: `minikube addons enable ingress`; Docker Desktop:
# install ingress-nginx). Then add "127.0.0.1 heart-risk.local" to your hosts file and call
#   curl http://heart-risk.local/health
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  ingressClassName: nginx
  rules:
    - host: heart-risk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-risk-api
                port: {number: 8080}
